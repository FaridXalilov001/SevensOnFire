<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevens on Fire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .slot-machine { display: flex; justify-content: center; gap: 10px; margin: 30px 0; }
        .reel { width: 80px; height: 80px; background: #222; border: 2px solid #gold; border-radius: 10px; font-size: 40px; line-height: 80px; }
        button { background: #ff4500; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .balance { font-size: 20px; color: #00ff88; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>🔥 Sevens on Fire 🔥</h1>
    <div class="balance">Balans: <span id="bal">100</span> $</div>
    
    <div class="slot-machine">
        <div class="reel" id="r1">❓</div>
        <div class="reel" id="r2">❓</div>
        <div class="reel" id="r3">❓</div>
    </div>

    <button onclick="spin()">FIRLAT (10$)</button>

    <script>
        let balance = 100;
        const items = ['🎰', '7️⃣', '🍒', '🍋', '💎'];

        function spin() {
            if (balance < 10) {
                alert("Balansınız çatmır!");
                return;
            }
            balance -= 10;
            document.getElementById('bal').innerText = balance;

            let res1 = items[Math.floor(Math.random() * items.length)];
            let res2 = items[Math.floor(Math.random() * items.length)];
            let res3 = items[Math.floor(Math.random() * items.length)];

            document.getElementById('r1').innerText = res1;
            document.getElementById('r2').innerText = res2;
            document.getElementById('r3').innerText = res3;

            if (res1 === res2 && res2 === res3) {
                balance += 100;
                document.getElementById('bal').innerText = balance;
                alert("TƏBRİKLƏR! 100$ qazandınız! 🎉");
            }
        }
    </script>
</body>
</html>
