<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevens on Fire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 15px; }

        .profile-card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: #ff4500; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .user-details { text-align: left; }
        .user-name { font-weight: bold; font-size: 16px; }
        .user-id { font-size: 12px; color: #aaa; }

        .balance-box { background: #2a2a2a; padding: 8px 12px; border-radius: 8px; border: 1px solid #00ff88; }
        .balance-val { color: #00ff88; font-weight: bold; font-size: 16px; }

        .action-btns { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .btn-deposit { background: #28a745; }
        .btn-withdraw { background: #dc3545; }

        .slot-machine { display: flex; justify-content: center; gap: 10px; margin: 25px 0; }
        .reel { width: 85px; height: 85px; background: #222; border: 2px solid #ff9900; border-radius: 12px; font-size: 42px; line-height: 85px; box-shadow: 0 0 10px rgba(255,153,0,0.3); }
        .btn-spin { background: #ff4500; color: white; border: none; padding: 16px; font-size: 20px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="user-info">
            <div class="user-avatar" id="avatar">👤</div>
            <div class="user-details">
                <div class="user-name" id="username">Oyunçu</div>
                <div class="user-id" id="userid">ID: ------</div>
            </div>
        </div>
        <div class="balance-box">
            <div>Balans:</div>
            <div class="balance-val"><span id="bal">100.00</span> USDT</div>
        </div>
    </div>

    <div class="action-btns">
        <button class="btn btn-deposit" onclick="deposit()">➕ Depozit</button>
        <button class="btn btn-withdraw" onclick="withdraw()">➖ Çıxarış</button>
    </div>

    <h2>🔥 Sevens on Fire 🔥</h2>
    <div class="slot-machine">
        <div class="reel" id="r1">🎰</div>
        <div class="reel" id="r2">7️⃣</div>
        <div class="reel" id="r3">🎰</div>
    </div>

    <button class="btn-spin" onclick="spin()">FIRLAT (1.00 USDT)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = user.first_name || "Oyunçu";
            document.getElementById('userid').innerText = "ID: " + user.id;
            if(user.first_name) {
                document.getElementById('avatar').innerText = user.first_name.charAt(0).toUpperCase();
            }
        }

        let balance = 100.00;
        const items = ['🎰', '7️⃣', '🍒', '🍋', '💎'];

        function spin() {
            if (balance < 1) {
                alert("Balansınız çatmır! Zəhmət olmasa depozit edin.");
                return;
            }
            balance -= 1;
            document.getElementById('bal').innerText = balance.toFixed(2);

            let res1 = items[Math.floor(Math.random() * items.length)];
            let res2 = items[Math.floor(Math.random() * items.length)];
            let res3 = items[Math.floor(Math.random() * items.length)];

            document.getElementById('r1').innerText = res1;
            document.getElementById('r2').innerText = res2;
            document.getElementById('r3').innerText = res3;

            if (res1 === res2 && res2 === res3) {
                balance += 20;
                document.getElementById('bal').innerText = balance.toFixed(2);
                alert("🎉 TƏBRİKLƏR! 20 USDT qazandınız!");
            }
        }

        function deposit() {
            alert("Depozit sistemi tezliklə aktiv olacaq!");
        }

        function withdraw() {
            alert("Çıxarış üçün minimum balans: 10 USDT");
        }
    </script>
</body>
</html>
